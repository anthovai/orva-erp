<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORVA — Intelligence Engineered</title>
<style>
:root{
  --bg:#0d1117;--panel:#161b22;--panel2:#1c2129;--border:#2d333b;
  --text:#e6edf3;--muted:#8b949e;--accent:#4f8ff7;--accent2:#3fb68b;
  --danger:#e5534b;--warn:#d29922;--radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.55 system-ui,'Segoe UI',sans-serif;min-height:100vh}
a{color:var(--accent);text-decoration:none}
button{font:inherit;cursor:pointer;border:none;border-radius:8px;padding:8px 16px;background:var(--accent);color:#fff}
button.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
button.ok{background:var(--accent2)}
button.bad{background:var(--danger)}
button:disabled{opacity:.5;cursor:default}
input,select{font:inherit;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:9px 12px;width:100%}
input:focus{outline:none;border-color:var(--accent)}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
h1{font-size:20px}h2{font-size:17px;margin-bottom:12px}h3{font-size:15px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;border:1px solid var(--border);color:var(--muted)}
.badge.green{color:var(--accent2);border-color:var(--accent2)}
.badge.yellow{color:var(--warn);border-color:var(--warn)}
.badge.red{color:var(--danger);border-color:var(--danger)}
.badge.blue{color:var(--accent);border-color:var(--accent)}
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
#login-box{width:400px;max-width:100%}
#login-box .logo{text-align:center;margin-bottom:24px}
.logo b{font-size:26px;letter-spacing:1px}
.logo span{display:block;color:var(--muted);font-size:12px;letter-spacing:2px;margin-top:2px}
#app{display:none;min-height:100vh}
#sidebar{position:fixed;inset:0 auto 0 0;width:220px;background:var(--panel);border-right:1px solid var(--border);padding:20px 12px;display:flex;flex-direction:column}
#sidebar .logo{padding:0 10px 18px}
#sidebar nav a{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:8px;color:var(--muted);margin-bottom:2px}
#sidebar nav a.active,#sidebar nav a:hover{background:var(--panel2);color:var(--text)}
#sidebar .foot{margin-top:auto;padding:10px;font-size:12px;color:var(--muted)}
#main{margin-left:220px;padding:26px 32px;max-width:1000px}
#topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.pill{background:var(--panel2);border:1px solid var(--border);border-radius:99px;padding:4px 14px;font-size:13px}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.list-item:last-child{border-bottom:none}
.list-item .grow{flex:1;min-width:0}
.list-item .title{font-weight:600}
.list-item .sub{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis}
#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:99}
.toast{background:var(--panel2);border:1px solid var(--accent);border-radius:10px;padding:12px 16px;max-width:340px;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:pop .25s ease}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.err{color:var(--danger);font-size:13px;margin-top:10px;min-height:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}#sidebar{display:none}#main{margin-left:0}}
code{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:2px 7px;font-size:12.5px;word-break:break-all}
.empty{color:var(--muted);text-align:center;padding:26px 0;font-size:14px}
#nav-notif-badge{background:var(--danger);color:#fff;font-size:11px;border-radius:99px;padding:0 7px;display:none}
</style>
</head>
<body>

<div id="login-screen">
  <div id="login-box" class="card">
    <div class="logo"><b>ORVA</b><span>INTELLIGENCE ENGINEERED</span></div>
    <div id="login-form">
      <label>Organization slug</label><input id="li-slug" placeholder="my-company">
      <label>Email</label><input id="li-email" type="email">
      <label>Password</label><input id="li-password" type="password">
      <div id="li-totp-wrap" style="display:none"><label>รหัส MFA (6 หลัก)</label><input id="li-totp" maxlength="6" inputmode="numeric"></div>
      <div class="err" id="li-err"></div>
      <div class="row" style="margin-top:8px">
        <button onclick="doLogin()" style="flex:1">เข้าสู่ระบบ</button>
        <button class="ghost" onclick="toggleSignup(true)">สร้างองค์กรใหม่</button>
      </div>
    </div>
    <div id="signup-form" style="display:none">
      <label>ชื่อองค์กร</label><input id="su-name">
      <label>Slug</label><input id="su-slug" placeholder="my-company">
      <label>อีเมลเจ้าขององค์กร</label><input id="su-email" type="email">
      <label>ชื่อที่แสดง</label><input id="su-display">
      <label>รหัสผ่าน (อย่างน้อย 8 ตัว)</label><input id="su-password" type="password">
      <div class="err" id="su-err"></div>
      <div class="row" style="margin-top:8px">
        <button class="ok" onclick="doProvision()" style="flex:1">สร้างองค์กร</button>
        <button class="ghost" onclick="toggleSignup(false)">กลับ</button>
      </div>
    </div>
  </div>
</div>

<div id="app">
  <aside id="sidebar">
    <div class="logo"><b>ORVA</b><span>INTELLIGENCE ENGINEERED</span></div>
    <nav>
      <a href="#dashboard" data-view="dashboard">Dashboard</a>
      <a href="#approvals" data-view="approvals">งานรออนุมัติ <span class="badge" id="nav-approvals-badge" style="display:none"></span></a>
      <a href="#notifications" data-view="notifications">การแจ้งเตือน <span id="nav-notif-badge"></span></a>
      <a href="#knowledge" data-view="knowledge">Knowledge</a>
      <a href="#worker" data-view="worker">Worker</a>
      <a href="#modules" data-view="modules">Modules</a>
      <a href="#settings" data-view="settings">ตั้งค่า</a>
    </nav>
    <div class="foot">
      <div id="whoami"></div>
      <a href="#" onclick="doLogout();return false">ออกจากระบบ</a>
    </div>
  </aside>
  <main id="main">
    <div id="topbar">
      <h1 id="view-title"></h1>
      <span class="pill" id="live-pill">● live</span>
    </div>
    <div id="view"></div>
  </main>
</div>

<div id="toasts"></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
let token=localStorage.getItem('orva_token')||null;
let me=null, sseAbort=null;

async function api(path,opts={}){
  const headers={'content-type':'application/json',...(opts.headers||{})};
  if(token) headers['authorization']='Bearer '+token;
  const res=await fetch(path,{...opts,headers});
  if(res.status===401 && me){ doLogout(); throw new Error('session expired'); }
  let body=null;
  const text=await res.text();
  if(text){ try{ body=JSON.parse(text);}catch{ body=text; } }
  if(!res.ok){ const msg=(body&&body.error)||res.status; const e=new Error(msg); e.status=res.status; throw e; }
  return body;
}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTime=t=>new Date(t).toLocaleString();

/* ---------- auth ---------- */
function toggleSignup(show){ $('login-form').style.display=show?'none':'block'; $('signup-form').style.display=show?'block':'none'; }
async function doLogin(){
  $('li-err').textContent='';
  try{
    const body={organization_slug:$('li-slug').value.trim(),email:$('li-email').value.trim(),password:$('li-password').value};
    const totp=$('li-totp').value.trim(); if(totp) body.totp_code=totp;
    const r=await api('/api/v1/auth/login',{method:'POST',body:JSON.stringify(body)});
    setToken(r.access_token);
  }catch(e){
    if(String(e.message).includes('totp_code')){ $('li-totp-wrap').style.display='block'; $('li-err').textContent='องค์กรนี้เปิด MFA — ใส่รหัสจาก authenticator app'; }
    else $('li-err').textContent=e.message;
  }
}
async function doProvision(){
  $('su-err').textContent='';
  try{
    const r=await api('/api/v1/organizations',{method:'POST',body:JSON.stringify({
      name:$('su-name').value.trim(),slug:$('su-slug').value.trim(),
      owner_email:$('su-email').value.trim(),owner_display_name:$('su-display').value.trim(),
      owner_password:$('su-password').value})});
    setToken(r.access_token);
  }catch(e){ $('su-err').textContent=e.message; }
}
function setToken(t){ token=t; localStorage.setItem('orva_token',t); boot(); }
function doLogout(){
  if(token) api('/api/v1/auth/logout',{method:'POST'}).catch(()=>{});
  token=null; me=null; localStorage.removeItem('orva_token');
  if(sseAbort) sseAbort.abort();
  $('app').style.display='none'; $('login-screen').style.display='flex';
}

/* ---------- shell ---------- */
async function boot(){
  if(!token){ doLogout(); return; }
  try{ me=await api('/api/v1/auth/me'); }catch{ doLogout(); return; }
  $('login-screen').style.display='none'; $('app').style.display='block';
  $('whoami').textContent=me.display_name+' · '+me.email;
  startStream(); refreshBadges();
  navigate(location.hash.slice(1)||'dashboard');
}
window.addEventListener('hashchange',()=>navigate(location.hash.slice(1)||'dashboard'));
const VIEWS={dashboard:'Dashboard',approvals:'งานรออนุมัติ',notifications:'การแจ้งเตือน',knowledge:'Knowledge',worker:'ORVA Worker',modules:'Modules',settings:'ตั้งค่า'};
function navigate(view){
  if(!VIEWS[view]) view='dashboard';
  document.querySelectorAll('#sidebar nav a').forEach(a=>a.classList.toggle('active',a.dataset.view===view));
  $('view-title').textContent=VIEWS[view];
  ({dashboard:renderDashboard,approvals:renderApprovals,notifications:renderNotifications,knowledge:renderKnowledge,worker:renderWorker,modules:renderModules,settings:renderSettings})[view]();
}
async function refreshBadges(){
  try{
    const tasks=await api('/api/v1/approval-tasks/mine');
    const b=$('nav-approvals-badge'); b.textContent=tasks.length; b.style.display=tasks.length?'inline-block':'none';
    const unread=await api('/api/v1/notifications?unread_only=true');
    const nb=$('nav-notif-badge'); nb.textContent=unread.length; nb.style.display=unread.length?'inline-block':'none';
  }catch{}
}

/* ---------- SSE (fetch stream — EventSource ใส่ Authorization header ไม่ได้) ---------- */
async function startStream(){
  if(sseAbort) sseAbort.abort();
  sseAbort=new AbortController();
  $('live-pill').style.color='var(--accent2)';
  try{
    const res=await fetch('/api/v1/notifications/stream',{headers:{authorization:'Bearer '+token},signal:sseAbort.signal});
    const reader=res.body.getReader(); const dec=new TextDecoder(); let buf='';
    for(;;){
      const {done,value}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      let idx;
      while((idx=buf.indexOf('\n\n'))>=0){
        const frame=buf.slice(0,idx); buf=buf.slice(idx+2);
        const data=frame.split('\n').filter(l=>l.startsWith('data: ')).map(l=>l.slice(6)).join('');
        if(data){ try{ onNotification(JSON.parse(data)); }catch{} }
      }
    }
  }catch{}
  $('live-pill').style.color='var(--muted)';
}
function onNotification(n){
  const t=document.createElement('div'); t.className='toast';
  t.innerHTML='<b>'+esc(n.title)+'</b><div class="muted">'+esc(n.body)+'</div>';
  $('toasts').appendChild(t); setTimeout(()=>t.remove(),8000);
  refreshBadges();
  if(location.hash==='#notifications') renderNotifications();
  if(location.hash==='#approvals'||location.hash==='') renderApprovals&&location.hash==='#approvals'&&renderApprovals();
}

/* ---------- views ---------- */
async function renderDashboard(){
  $('view').innerHTML='<div class="card"><h2>ถาม AI Analyst</h2>'+
    '<label>คำถามถึงข้อมูลองค์กร (เว้นว่าง = วิเคราะห์ภาพรวม)</label><input id="ai-q" placeholder="เช่น สัปดาห์นี้มีอะไรผิดปกติมั้ย">'+
    '<div style="margin-top:12px"><button onclick="askAi()">วิเคราะห์</button></div>'+
    '<div id="ai-out" style="white-space:pre-wrap;margin-top:12px"></div><div class="err" id="ai-err"></div></div>'+
    '<div class="grid2"><div class="card"><h2>Recommendations</h2><div id="d-recs" class="empty">กำลังโหลด…</div></div><div class="card"><h2>Insights ล่าสุด</h2><div id="d-insights" class="empty">กำลังโหลด…</div></div></div>';
  try{
    const recs=await api('/api/v1/recommendations?status=pending');
    $('d-recs').className=''; $('d-recs').innerHTML=recs.length?recs.map(r=>
      '<div class="list-item"><div class="grow"><div class="title">'+esc(r.title)+(r.source==='ai'?' <span class="badge blue">AI</span>':'')+'</div><div class="sub">'+esc(r.description)+'</div></div>'+
      '<button class="ok" onclick="decideRec(\''+r.id+'\',true)">Accept</button>'+
      '<button class="ghost" onclick="decideRec(\''+r.id+'\',false)">Dismiss</button></div>').join('')
      :'<div class="empty">ไม่มี recommendation ที่รอตัดสิน</div>';
  }catch(e){ $('d-recs').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }
  try{
    const ins=await api('/api/v1/insights');
    $('d-insights').className=''; $('d-insights').innerHTML=ins.length?ins.slice(0,8).map(i=>
      '<div class="list-item"><div class="grow"><div class="title">'+esc(i.title)+'</div><div class="sub">'+esc(i.description)+'</div></div><span class="badge blue">'+esc(i.rule_name)+'</span></div>').join('')
      :'<div class="empty">ยังไม่มี insight — ตั้ง intelligence rule เพื่อเริ่มเฝ้า event</div>';
  }catch(e){ $('d-insights').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }
}
async function askAi(){
  $('ai-err').textContent=''; $('ai-out').textContent='กำลังวิเคราะห์… (อาจใช้เวลาสักครู่)';
  try{
    const q=$('ai-q').value.trim();
    const r=await api('/api/v1/intelligence/analyze',{method:'POST',body:JSON.stringify(q?{question:q}:{})});
    $('ai-out').textContent=r.analysis;
    if(r.recommendation){ toast('AI เสนอ recommendation: '+r.recommendation.title); renderDashboard(); $('ai-out').textContent=r.analysis; }
  }catch(e){ $('ai-out').textContent=''; $('ai-err').textContent=e.message; }
}
async function decideRec(id,accept){
  try{
    const r=await api('/api/v1/recommendations/'+id+'/'+(accept?'accept':'dismiss'),{method:'POST'});
    if(accept&&r.resulting_workflow_id) toast('สร้าง workflow แล้ว: '+r.resulting_workflow_id);
    renderDashboard();
  }catch(e){ toast(e.message); }
}
async function renderApprovals(){
  $('view').innerHTML='<div class="card"><h2>งานที่รอคุณอนุมัติ</h2><div id="a-list" class="empty">กำลังโหลด…</div></div>';
  try{
    const tasks=await api('/api/v1/approval-tasks/mine');
    $('a-list').className=''; $('a-list').innerHTML=tasks.length?tasks.map(t=>
      '<div class="list-item"><div class="grow"><div class="title">Workflow '+esc(t.workflow_instance_id)+'</div><div class="sub">approval task '+esc(t.id)+'</div></div>'+
      '<button class="ok" onclick="decideTask(\''+t.id+'\',true)">อนุมัติ</button>'+
      '<button class="bad" onclick="decideTask(\''+t.id+'\',false)">ปฏิเสธ</button></div>').join('')
      :'<div class="empty">ไม่มีงานรออนุมัติ 🎉</div>';
  }catch(e){ $('a-list').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }
  refreshBadges();
}
async function decideTask(id,approve){
  try{
    await api('/api/v1/approval-tasks/'+id+'/'+(approve?'approve':'reject'),{method:'POST',body:approve?undefined:JSON.stringify({reason:'rejected via UI'})});
    toast(approve?'อนุมัติแล้ว':'ปฏิเสธแล้ว'); renderApprovals();
  }catch(e){ toast(e.message); }
}
async function renderNotifications(){
  $('view').innerHTML='<div class="card"><h2>การแจ้งเตือน</h2><div id="n-list" class="empty">กำลังโหลด…</div></div>';
  try{
    const list=await api('/api/v1/notifications');
    $('n-list').className=''; $('n-list').innerHTML=list.length?list.map(n=>
      '<div class="list-item"><div class="grow"><div class="title">'+esc(n.title)+(n.read_at?'':' <span class="badge red">ใหม่</span>')+'</div>'+
      '<div class="sub">'+esc(n.body)+' · '+fmtTime(n.created_at)+'</div></div><span class="badge">'+esc(n.channel)+'</span>'+
      (n.read_at||n.channel!=='in_app'?'':'<button class="ghost" onclick="markRead(\''+n.id+'\')">อ่านแล้ว</button>')+'</div>').join('')
      :'<div class="empty">ยังไม่มีการแจ้งเตือน</div>';
  }catch(e){ $('n-list').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }
  refreshBadges();
}
async function markRead(id){ try{ await api('/api/v1/notifications/'+id+'/read',{method:'POST'}); renderNotifications(); }catch(e){ toast(e.message); } }
/* ---------- ORVA Worker (ADR 0019) ---------- */
async function renderWorker(){
  $('view').innerHTML='<div class="card"><h2>มอบงานให้ ORVA Worker</h2>'+
    '<label>สิ่งที่อยากให้ worker ทำ</label><input id="w-instr" placeholder="เช่น รวบรวมใบเสนอราคาจากอีเมลสัปดาห์นี้">'+
    '<div style="margin-top:12px"><button onclick="queueTask()">เข้าคิว</button></div><div class="err" id="w-err"></div></div>'+
    '<div class="card"><h2>คิวงาน</h2><div id="w-list" class="empty">กำลังโหลด…</div></div>';
  try{
    const tasks=await api('/api/v1/worker/tasks');
    const badge={pending:'',running:'blue',succeeded:'green',failed:'red',cancelled:''};
    $('w-list').className=''; $('w-list').innerHTML=tasks.length?tasks.map(t=>
      '<div class="list-item"><div class="grow"><div class="title">'+esc(t.instruction)+'</div>'+
      '<div class="sub">'+esc(t.source)+(t.result?' — '+esc(t.result):'')+(t.error?' — '+esc(t.error):'')+'</div></div>'+
      '<span class="badge '+(badge[t.status]||'')+'">'+esc(t.status)+'</span>'+
      (t.status==='pending'?'<button class="ghost" onclick="cancelTask(\''+t.id+'\')">ยกเลิก</button>':'')+'</div>').join('')
      :'<div class="empty">ยังไม่มีงานในคิว</div>';
  }catch(e){ $('w-list').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }
}
async function queueTask(){
  $('w-err').textContent='';
  try{
    await api('/api/v1/worker/tasks',{method:'POST',body:JSON.stringify({instruction:$('w-instr').value.trim()})});
    renderWorker();
  }catch(e){ $('w-err').textContent=e.message; }
}
async function cancelTask(id){
  try{ await api('/api/v1/worker/tasks/'+id+'/cancel',{method:'POST'}); renderWorker(); }catch(e){ toast(e.message); }
}

/* ---------- knowledge (ADR 0017) ---------- */
async function renderKnowledge(){
  $('view').innerHTML='<div class="grid2"><div class="card"><h2>Notes</h2><div id="k-list" class="empty">กำลังโหลด…</div>'+
  '<label>หัวข้อ</label><input id="k-title"><label>เนื้อหา — ลิงก์ด้วย [[ชื่อโน้ต]], [[employee:email]], [[product:sku]]</label>'+
  '<textarea id="k-content" rows="5" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:9px 12px;font:inherit"></textarea>'+
  '<div style="margin-top:12px"><button onclick="createNote()">สร้างโน้ต</button></div><div class="err" id="k-err"></div></div>'+
  '<div class="card"><h2 id="k-detail-title">เลือกโน้ตเพื่อดู</h2><div id="k-detail"></div></div></div>';
  try{
    const notes=await api('/api/v1/knowledge/notes');
    $('k-list').className=''; $('k-list').innerHTML=notes.length?notes.map(n=>
      '<div class="list-item"><div class="grow"><a href="#" onclick="openNote(\''+n.id+'\');return false" class="title">'+esc(n.title)+'</a>'+
      '<div class="sub">'+esc((n.content||'').slice(0,80))+'</div></div>'+
      '<button class="ghost" onclick="deleteNote(\''+n.id+'\')">ลบ</button></div>').join('')
      :'<div class="empty">ยังไม่มีโน้ต — สร้างโน้ตแรกด้านล่าง</div>';
  }catch(e){ $('k-list').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }
}
async function createNote(){
  $('k-err').textContent='';
  try{
    await api('/api/v1/knowledge/notes',{method:'POST',body:JSON.stringify({title:$('k-title').value.trim(),content:$('k-content').value})});
    renderKnowledge();
  }catch(e){ $('k-err').textContent=e.message; }
}
async function deleteNote(id){
  try{ await api('/api/v1/knowledge/notes/'+id,{method:'DELETE'}); renderKnowledge(); }catch(e){ toast(e.message); }
}
async function openNote(id){
  try{
    const n=await api('/api/v1/knowledge/notes/'+id);
    $('k-detail-title').textContent=n.title;
    const badge=k=>({note:'blue',employee:'green',product:'yellow',missing:'red'}[k]||'');
    $('k-detail').innerHTML=
      '<div style="white-space:pre-wrap;margin-bottom:14px">'+esc(n.content)+'</div>'+
      '<h3>ลิงก์ขาออก</h3>'+(n.links.length?n.links.map(l=>
        '<span class="badge '+badge(l.to_note_id?l.target_kind:(l.target_kind==='note'?'missing':l.target_kind))+'" style="margin:2px">'+esc(l.target_kind)+': '+esc(l.target_ref)+(l.target_kind==='note'&&!l.to_note_id?' (ยังไม่ถูกเขียน)':'')+'</span>').join(' ')
        :'<span class="muted">ไม่มี</span>')+
      '<h3 style="margin-top:12px">Backlinks</h3>'+(n.backlinks.length?n.backlinks.map(b=>
        '<div><a href="#" onclick="openNote(\''+b.id+'\');return false">'+esc(b.title)+'</a></div>').join('')
        :'<span class="muted">ไม่มีใครลิงก์มา</span>');
  }catch(e){ toast(e.message); }
}

async function renderModules(){
  $('view').innerHTML='<div class="grid2"><div class="card"><h2>Compiled Modules</h2><div id="m-core" class="empty">กำลังโหลด…</div></div>'+
  '<div class="card"><h2>External Modules</h2><div id="m-ext" class="empty">กำลังโหลด…</div>'+
  '<label>ชื่อ</label><input id="em-name" placeholder="horilla"><label>Base URL</label><input id="em-url" placeholder="http://horilla.internal:8000">'+
  '<div style="margin-top:12px"><button onclick="registerExt()">ลงทะเบียน</button></div><div class="err" id="em-err"></div></div></div>';
  try{
    const mods=await api('/api/v1/modules');
    $('m-core').className=''; $('m-core').innerHTML=(mods.length?mods:[]).map(m=>
      '<div class="list-item"><div class="grow"><div class="title">'+esc(m.name||m.module_name)+'</div><div class="sub">v'+esc(m.version||'')+'</div></div>'+
      '<span class="badge '+(m.enabled===false?'red':'green')+'">'+(m.enabled===false?'disabled':'available')+'</span></div>').join('')||'<div class="empty">ไม่มี</div>';
  }catch(e){ $('m-core').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }
  try{
    const exts=await api('/api/v1/external-modules');
    $('m-ext').className=''; $('m-ext').innerHTML=exts.length?exts.map(m=>
      '<div class="list-item"><div class="grow"><div class="title">'+esc(m.name)+'</div><div class="sub">'+esc(m.base_url)+'</div></div>'+
      '<span class="badge '+(m.enabled?'green':'red')+'">'+(m.enabled?'enabled':'disabled')+'</span>'+
      '<button class="ghost" onclick="toggleExt(\''+m.name+'\','+!m.enabled+')">'+(m.enabled?'ปิด':'เปิด')+'</button></div>').join('')
      :'<div class="empty">ยังไม่มี external module</div>';
  }catch(e){ $('m-ext').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }
}
async function registerExt(){
  $('em-err').textContent='';
  try{ await api('/api/v1/external-modules',{method:'POST',body:JSON.stringify({name:$('em-name').value.trim(),base_url:$('em-url').value.trim()})}); renderModules(); }
  catch(e){ $('em-err').textContent=e.message; }
}
async function toggleExt(name,enable){ try{ await api('/api/v1/external-modules/'+name+'/'+(enable?'enable':'disable'),{method:'POST'}); renderModules(); }catch(e){ toast(e.message); } }
async function renderSettings(){
  $('view').innerHTML='<div class="grid2">'+
  '<div class="card"><h2>MFA (TOTP)</h2><p class="muted">เพิ่มความปลอดภัยด้วยรหัสจาก authenticator app</p>'+
  '<div id="mfa-area" style="margin-top:12px"><button onclick="mfaSetup()">เริ่มตั้งค่า MFA</button></div></div>'+
  '<div class="card"><h2>Rate limit ขององค์กร</h2><p class="muted">จำนวน request/นาที รวมทั้งองค์กร (เว้นว่าง = ค่า default ของระบบ)</p>'+
  '<label>requests / minute</label><input id="rl-value" type="number" min="1">'+
  '<div style="margin-top:12px"><button onclick="setRateLimit()">บันทึก</button></div><div class="err" id="rl-err"></div></div></div>';
}
async function mfaSetup(){
  try{
    const r=await api('/api/v1/auth/mfa/setup',{method:'POST'});
    $('mfa-area').innerHTML='<p class="muted">สแกน/กรอกใน authenticator app แล้วใส่รหัส 6 หลักเพื่อยืนยัน</p>'+
      '<label>Secret</label><code>'+esc(r.secret)+'</code><label>otpauth URI</label><code>'+esc(r.otpauth_uri)+'</code>'+
      '<label>รหัสยืนยัน</label><input id="mfa-code" maxlength="6" inputmode="numeric">'+
      '<div style="margin-top:12px"><button class="ok" onclick="mfaActivate()">ยืนยันและเปิดใช้</button></div><div class="err" id="mfa-err"></div>';
  }catch(e){ toast(e.message); }
}
async function mfaActivate(){
  try{ await api('/api/v1/auth/mfa/activate',{method:'POST',body:JSON.stringify({code:$('mfa-code').value.trim()})});
    $('mfa-area').innerHTML='<span class="badge green">MFA เปิดใช้งานแล้ว</span>'; toast('MFA เปิดใช้งานแล้ว');
  }catch(e){ $('mfa-err').textContent=e.message; }
}
async function setRateLimit(){
  $('rl-err').textContent='';
  const v=$('rl-value').value.trim();
  try{ await api('/api/v1/organizations/current/rate-limit',{method:'POST',body:JSON.stringify({requests_per_minute:v?Number(v):null})}); toast('บันทึก rate limit แล้ว'); }
  catch(e){ $('rl-err').textContent=e.message; }
}
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; $('toasts').appendChild(t); setTimeout(()=>t.remove(),6000); }

/* ---------- start ---------- */
if(token) boot();
</script>
</body>
</html>
