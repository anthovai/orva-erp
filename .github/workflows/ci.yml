name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: orva
          POSTGRES_PASSWORD: orva
          POSTGRES_DB: orva_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ORVA_TEST_DATABASE_URL: postgres://orva_app:orva@localhost:5432/orva_test
    steps:
      - uses: actions/checkout@v4
      # RLS ต้องการ role ที่ไม่ใช่ superuser (superuser ข้าม policy หมด) — ดู ADR 0005
      - name: Create non-superuser app role
        run: |
          PGPASSWORD=orva psql -h localhost -U orva -d orva_test \
            -c "CREATE ROLE orva_app LOGIN PASSWORD 'orva' NOSUPERUSER NOBYPASSRLS IN ROLE orva;"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace
