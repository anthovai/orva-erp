[package]
name = "orva-payroll-engine"
version = "0.2.0"
edition = "2021"
description = "Orva payroll calculation sidecar - Thai SSO + progressive withholding tax"
license = "MIT"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
