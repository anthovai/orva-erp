# ORVA Core — default configuration
# ทุกค่า override ได้ด้วย env: ORVA_SERVER_HOST, ORVA_SERVER_PORT, ORVA_DATABASE_URL
# หรือชี้ไฟล์ config อื่นด้วย ORVA_CONFIG=<path>

[server]
host = "127.0.0.1"
port = 8080

[database]
url = "postgres://orva_app:orva@localhost:5432/orva"

[auth]
# RSA private key (PKCS#8 PEM) สำหรับเซ็น ID token RS256 — ไม่มีไฟล์ = generate ให้ตอน start (dev)
# production: provision key เองแล้วชี้ path นี้ หรือ env ORVA_JWT_RSA_KEY_PATH
rsa_key_path = "config/keys/jwt_rsa.pem"
issuer = "orva-core"

# เปิดชั้น AI (ADR 0018): ใส่ section [ai] หรือ env ORVA_AI_API_KEY (หรือ ANTHROPIC_API_KEY)
# ไม่ตั้ง = POST /api/v1/intelligence/analyze ตอบ 400
# อย่า commit key จริงลงไฟล์นี้ — ใช้ env ในเครื่อง/secret manager แทน
# [ai]
# api_key = "sk-ant-..."
# model = "claude-opus-5"   # ไม่ระบุ = default ของ orva-intelligence

# เปิดส่งอีเมลจริง: ใส่ section [email] หรือ env ORVA_SMTP_HOST + ORVA_SMTP_FROM
# (dev: docker compose มี Mailpit — SMTP :1025, Web UI http://localhost:8025)
# [email]
# smtp_host = "localhost"
# smtp_port = 1025
# smtp_tls = false
# from_address = "ORVA <no-reply@orva.local>"
