  <circle cx="40" cy="36" r="14" fill="url(#mfbg)"/>
  <path d="M40 27 a9.5 9.5 0 1 0 6.7 2.8" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="48" cy="28.5" r="2.6" fill="#7EE0C4"/>
  <text x="62" y="41" fill="#fff" font-size="16" font-weight="700">Orva</text>
