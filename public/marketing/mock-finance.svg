      <stop offset="0" stop-color="#11836E"/><stop offset="1" stop-color="#0A4A3E"/>
    </linearGradient>
  </defs>
  <rect width="960" height="560" rx="16" fill="#F6F8F7"/>
  <rect width="960" height="560" rx="16" fill="none" stroke="#D9E2DE"/>
