# ORVA — dev environment
services:
  postgres:
    image: postgres:17
    container_name: orva-postgres
    environment:
      POSTGRES_USER: orva
      POSTGRES_PASSWORD: orva
      POSTGRES_DB: orva
    ports:
      - "5432:5432"
    volumes:
      - orva-pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orva"]
      interval: 5s
      timeout: 3s
      retries: 10

  # SMTP จำลองสำหรับ dev (ADR 0008) — SMTP :1025, Web UI/REST :8025
  mailpit:
    image: axllent/mailpit
    container_name: orva-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  # ---- Horilla HRM (external OSS module — ADR 0014, LGPL boundary: แยก process/DB เด็ดขาด) ----
  horilla-db:
    image: postgres:16-bullseye
    container_name: orva-horilla-db
    environment:
      POSTGRES_DB: horilla
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - horilla-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  horilla:
    image: horilla/horilla:1.4
    container_name: orva-horilla
    environment:
      DATABASE_URL: "postgres://postgres:postgres@horilla-db:5432/horilla"
    # image default bind 127.0.0.1 — ต้อง 0.0.0.0 ให้ host (และ ORVA proxy) เข้าถึงได้
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      horilla-db:
        condition: service_healthy

volumes:
  orva-pgdata:
  horilla-pgdata:
