services:
  postgres:
    image: pgvector/pgvector:pg17-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-open-mercato}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mercato-network

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis_data:/data
    command: redis-server /usr/local/etc/redis/redis.conf --maxmemory ${REDIS_MAXMEMORY:-512mb}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mercato-network

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-meilisearch-dev-key}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "${MEILISEARCH_PORT:-7700}:7700"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mercato-network

  localstack:
    image: localstack/localstack:latest
    restart: unless-stopped
    profiles:
      - storage-s3
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
      LOCALSTACK_HOST: localhost
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mercato-network

  # KKG-Tasking — the company's Vikunja fork, run as part of this stack rather
  # than as a separate deployment. Orva serves it under /tasks so the two are
  # one application to the user; see the rewrites in next.config.ts.
  #
  # The source is a submodule (vendor/kkg-tasking) rather than copied files, so
  # fork-update.sh keeps working and upstream Vikunja releases can still be
  # merged. SQLite is deliberate: the fork adds no tables, which is exactly what
  # makes those upstream merges cheap.
  tasking:
    build:
      context: ./vendor/kkg-tasking
      dockerfile: Dockerfile.th
      args:
        # Baked in at build time: Vite writes it into every asset URL and the
        # Vue router reads it as BASE_URL.
        VIKUNJA_FRONTEND_BASE: /tasks/
        # /api belongs to Orva, so the Go service is proxied at /tasks-api.
        VIKUNJA_API_URL: /tasks-api/api/v1
        RELEASE_VERSION: kkg-th
    restart: unless-stopped
    environment:
      VIKUNJA_SERVICE_PUBLICURL: ${TASKING_PUBLIC_URL:-http://localhost:3100/tasks/}
      # One system means one place to get an account: Orva.
      VIKUNJA_SERVICE_ENABLEREGISTRATION: "false"
      VIKUNJA_LOG_LEVEL: INFO
    ports:
      # Exposed for debugging; normal use goes through Orva at /tasks.
      - "${TASKING_PORT:-3456}:3456"
    volumes:
      - tasking_db:/db
      - tasking_files:/app/vikunja/files
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3456/api/v1/info"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - mercato-network

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
  localstack_data:
  tasking_db:
  tasking_files:

networks:
  mercato-network:
    driver: bridge
