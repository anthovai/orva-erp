# ORVA — dev environment
services:
  postgres:
    image: postgres:17
    container_name: orva-postgres
    environment:
      POSTGRES_USER: orva
      POSTGRES_PASSWORD: orva
      POSTGRES_DB: orva
    ports:
      - "5432:5432"
    volumes:
      - orva-pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orva"]
      interval: 5s
      timeout: 3s
      retries: 10

  # SMTP จำลองสำหรับ dev (ADR 0008) — SMTP :1025, Web UI/REST :8025
  mailpit:
    image: axllent/mailpit
    container_name: orva-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  # ---- Horilla HRM (external OSS module — ADR 0014, LGPL boundary: แยก process/DB เด็ดขาด) ----
  horilla-db:
    image: postgres:16-bullseye
    container_name: orva-horilla-db
    environment:
      POSTGRES_DB: horilla
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - horilla-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  horilla:
    image: horilla/horilla:1.4
    container_name: orva-horilla
    environment:
      DATABASE_URL: "postgres://postgres:postgres@horilla-db:5432/horilla"
      # ORVA SSO overlay (Phase 2 — docs/modules/horilla.md): middleware verify
      # X-Orva-Identity ผ่าน JWKS ของ ORVA แล้ว auto-login โดยไม่แตะ source ของ Horilla
      DJANGO_SETTINGS_MODULE: "orva_sso.settings"
      ORVA_JWKS_URL: "http://host.docker.internal:8080/.well-known/jwks.json"
      # event hooks (Horilla -> ORVA Event Bus): ออก service key ที่มี scope
      # agent:event:publish แล้วตั้ง HORILLA_ORVA_SERVICE_KEY ก่อน `docker compose up`
      # (ว่าง = hook ปิดตัวเองเงียบ ๆ — ดู docs/modules/horilla.md)
      ORVA_EVENTS_URL: "http://host.docker.internal:8080/api/v1/agent/events"
      ORVA_SERVICE_KEY: "${HORILLA_ORVA_SERVICE_KEY:-}"
    volumes:
      - ./docker/horilla/orva_sso:/app/orva_sso:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # image default bind 127.0.0.1 — ต้อง 0.0.0.0 ให้ host (และ ORVA proxy) เข้าถึงได้
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      horilla-db:
        condition: service_healthy

  # ---- InvenTree Inventory (external OSS module — ADR 0014, MIT; แยก process/DB) ----
  inventree-db:
    image: postgres:16-bullseye
    container_name: orva-inventree-db
    environment:
      POSTGRES_DB: inventree
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - inventree-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  inventree:
    image: inventree/inventree:stable
    container_name: orva-inventree
    environment:
      INVENTREE_DB_ENGINE: postgresql
      INVENTREE_DB_NAME: inventree
      INVENTREE_DB_HOST: inventree-db
      INVENTREE_DB_PORT: 5432
      INVENTREE_DB_USER: postgres
      INVENTREE_DB_PASSWORD: postgres
      INVENTREE_SECRET_KEY: "orva-dev-inventree-secret"
      INVENTREE_DEBUG: "false"
      INVENTREE_AUTO_UPDATE: "true"
      INVENTREE_SITE_URL: "http://localhost:8001"
      INVENTREE_ADMIN_USER: "orva-admin"
      INVENTREE_ADMIN_PASSWORD: "orva-admin-pass"
      INVENTREE_ADMIN_EMAIL: "admin@orva.local"
      # SSO ผ่าน ORVA proxy: เชื่อ header จาก proxy (remote-user auth ในตัวของ InvenTree)
      # ⚠️ dev เท่านั้น — production ห้าม expose port 8001 ตรง (header ปลอมได้ถ้าเข้าถึงตรง)
      INVENTREE_REMOTE_LOGIN: "true"
      INVENTREE_REMOTE_LOGIN_HEADER: "HTTP_X_ORVA_USER_EMAIL"
      # ORVA event bridge plugin (docker/inventree/plugins/orva_events.py)
      INVENTREE_PLUGINS_ENABLED: "true"
      ORVA_EVENTS_URL: "http://host.docker.internal:8080/api/v1/agent/events"
      ORVA_SERVICE_KEY: "${INVENTREE_ORVA_SERVICE_KEY:-}"
    volumes:
      - ./docker/inventree/plugins:/home/inventree/data/plugins
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8000"
    restart: unless-stopped
    depends_on:
      inventree-db:
        condition: service_healthy

volumes:
  orva-pgdata:
  horilla-pgdata:
  inventree-pgdata:
